name: Publish design previews

on:
  push:
    branches:
      - main
      - soft-signal
      - after-hours
      - pixel-frequency
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout all design branches
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh shared catalogue
        run: |
          git checkout main
          git pull --ff-only origin main
          python tools/catalog.py
          git add catalog/library.json
          if ! git diff --cached --quiet; then
            git config user.name "BGU Radio catalogue"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh public station catalogue"
            git push origin HEAD:main
          fi
      - name: Assemble branch previews
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp catalog/library.json dist/library.json
          mkdir -p dist/main/downloads
          cp -r radio/. dist/main/
          (cd extension && zip -q ../dist/main/downloads/bgu-radio-player.zip *.json *.js *.html *.css)
          for slug in soft-signal after-hours pixel-frequency; do
            mkdir -p "dist/$slug"
            git archive "origin/$slug" index.html edition.css | tar -x -C "dist/$slug"
            if [ "$slug" = pixel-frequency ]; then
              git archive "origin/$slug" art | tar -x -C "dist/$slug"
            fi
          done
          touch dist/.nojekyll

      - name: Capture desktop and mobile comparison
        run: |
          python -m pip install playwright Pillow
          python -m playwright install chromium
          python tools/prepare_media.py
          python -m http.server 8765 --directory dist > /tmp/bgu-preview.log 2>&1 &
          python tools/preview_checks.py

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
