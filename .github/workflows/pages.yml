name: Publish design previews

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (three independent site sources)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh canonical station catalogue
        run: |
          git pull --ff-only origin main
          python tools/catalog.py
          python tools/curate.py --check
          python -m unittest discover -s tools -p test_curate.py
          git add data/library.json data/curation.json
          if ! git diff --cached --quiet; then
            git config user.name "BGU Radio catalogue"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh public station catalogue"
            git push origin HEAD:main
          fi

      - name: Verify architecture and shared source
        run: python tools/architecture_checks.py

      - name: Assemble independent previews and preserve legacy links
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/data dist/main/downloads
          cp data/*.json dist/data/
          # The historic /main/ player still expects this compatibility URL.
          cp data/library.json dist/library.json
          cp -r radio/. dist/main/
          python - <<'PY'
          import json
          from pathlib import Path
          station = json.loads(Path("data/station.json").read_text(encoding="utf-8"))
          Path("dist/main/station-info.js").write_text(
              "window.BGU_CONTENT = " + json.dumps(station, ensure_ascii=False) + ";\n",
              encoding="utf-8")
          PY
          (cd extension && zip -q ../dist/main/downloads/bgu-radio-player.zip *.json *.js *.html *.css)
          for slug in soft-signal after-hours pixel-frequency; do
            mkdir -p "dist/$slug"
            cp -r "sites/$slug/." "dist/$slug/"
          done
          touch dist/.nojekyll

      - name: Cache media in each site and smoke-test navigation
        run: |
          python -m pip install playwright Pillow
          python -m playwright install chromium
          python tools/prepare_media.py
          python -m http.server 8765 --directory dist > /tmp/bgu-preview.log 2>&1 &
          python tools/preview_checks.py

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
